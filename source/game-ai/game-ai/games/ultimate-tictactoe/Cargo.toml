[package]
name = "ai-ultimate-tictactoe"
version = "0.1.0"
default-run = "ai-ultimate-tictactoe"
authors = ["Nick Gustafson"]
edition = "2024"
rust-version = "1.85"
description = "A compact Ultimate Tic-Tac-Toe engine with alpha-beta search"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/ai-ultimate-tictactoe"
homepage = "https://thegustafson.com/games/tic-tac-toe"
repository = "https://github.com/TheGustafson/ai-ultimate-tictactoe"
keywords = ["ultimate-tic-tac-toe", "game", "engine", "alpha-beta", "wasm"]
categories = ["game-engines", "wasm"]
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ai-ultimate-tictactoe"
path = "src/bin/engine.rs"

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2.126", optional = true }

[lints.rust]
unsafe_code = "forbid"
